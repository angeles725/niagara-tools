<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>narrow-breaks</title>
<style>
  body { margin: 0; }
  /* fits a 1280 panel, but a fixed 600px box overflows a 360 phone viewport horizontally */
  #box { width: 600px; height: 100px; background: #36c; }
</style></head>
<body>
<div id="box">fixed 600px</div>
</body></html>
