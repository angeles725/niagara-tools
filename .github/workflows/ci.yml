name: CI

# Server-side enforcement of the same checks the pre-commit checklist (CONTRIBUTING.md §6)
# and the pre-push gate cover — runs on GitHub for every push/PR, so it cannot be bypassed
# by a clone that did not opt into the client-side hook (scripts/install-hooks.sh).

on:
  push:
    branches: [main]
  # A draft PR runs every job too: a defect only CI's pinned tools catch must surface while the PR is a draft, not
  # in its merge turn (#675 stayed a draft through review; bats 1.10 refused it at merge). (retro 2026-11-15 coordination-stretch C8)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to a PR cancels its superseded run, so only the PR head is checked. A push to main
# keys on its commit (one group per merge) and never cancels: every merge keeps its own full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The checks run as parallel jobs (go, two bats shards, lint-sweeps, changelog); the wall time is the slowest
  # job, not their sum. Every step of the former single `checks` job runs in exactly one of them. The mcp-n4
  # black-box suite (go/internal/mcpn4/blackbox) runs in the go job's `go test -count=1 ./...`; its own job retired
  # with the Python suite (T9). The bats suite is split by scripts/bats-shard.sh (duration-weighted, every
  # tests/*.bats file in exactly one shard, checked in each shard), because one bats job was the critical path.
  go:
    name: Go gofmt + vet + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go (version from go/go.mod — the niagara-tools Go module)
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          # No go.sum (the module has no dependencies): key the build cache on go.mod instead.
          cache: true
          cache-dependency-path: go/go.mod

      # The python3 of the reference host. No Go test runs Python since S17 (the mcp-n4 differentials
      # replay frozen goldens); the later steps that call python3 run this one.
      - name: Set up CPython 3.15 (the python3 the later steps run)
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      # The vendorfloor tests drive node + acorn (the lint-vendor-floor driver). Without these two steps they skip
      # and only the bats job exercises the real driver; KIT_REQUIRE_JS_TOOLS turns a missing tool into a failure.
      # The bats job asserts the installed versions against the pins.
      - name: Set up Node.js 24.19.0 (npm cache keyed on toolbelt/eslint/package-lock.json)
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: build-n4-module-kit/toolbelt/eslint/package-lock.json

      - name: Install the pinned npm tools (npm ci from toolbelt/eslint/package-lock.json)
        run: npm ci --prefix build-n4-module-kit/toolbelt/eslint --ignore-scripts --no-audit --no-fund

      - name: Go gofmt + vet + test (go/)
        run: |
          cd go
          # A missing node or acorn fails the vendorfloor tests instead of skipping them (set here, not as step env:
          # ci-local replays the run text only).
          export KIT_REQUIRE_JS_TOOLS=1
          # The assignment fails the step when gofmt itself fails; a non-empty list fails it too.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then printf 'gofmt -l lists unformatted files:\n%s\n' "$unformatted" >&2; exit 1; fi
          go vet ./...
          # -count=1: tests read files through subprocesses Go does not track, so a cached result could be stale.
          go test -count=1 ./...

      - name: Go build (go/bin — the binaries the toolbelt wrappers exec)
        run: cd go && go build -o bin/ ./cmd/...

  bats:
    name: bats unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One job per shard; every step below runs in each of them (scripts/ci-local.sh replays ci.yml step by step and
    # reads no job-level env: or step-level if:, so the shard reaches the steps through $GITHUB_ENV).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5

      # The one place the matrix reaches a run: body. The quoted ${{ }} text is a plain string in a local replay,
      # where $GITHUB_ENV is unset and SHARD/SHARDS stay unset: the later steps then run every tests/*.bats file.
      - name: Select this job's bats shard (SHARD of SHARDS, from the matrix)
        run: |
          printf 'SHARD=%s\nSHARDS=%s\n' '${{ matrix.shard }}' '${{ strategy.job-total }}' >> "${GITHUB_ENV:-/dev/null}"

      # Fail closed before any setup: every tests/*.bats file is in exactly one shard (a new file can never
      # be silently skipped), and this shard's list is not empty.
      - name: bats-shard --check (the shards partition tests/*.bats exactly)
        run: |
          scripts/bats-shard.sh --check "${SHARDS:-2}"
          [ -z "${SHARD:-}" ] || [ -n "$(scripts/bats-shard.sh "$SHARD" "$SHARDS")" ] \
            || { printf 'ERROR: shard %s/%s is empty\n' "$SHARD" "$SHARDS" >&2; exit 1; }

      - name: Set up Java 8 (Temurin) — required by run-pure-test.sh javac -source 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache the two pinned test jars (Maven Central rate-limits the runners with 429)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1/junit/junit/4.13.2
            ~/.gradle/caches/modules-2/files-2.1/org.hamcrest/hamcrest-core/1.3
          key: pinned-test-jars-junit-4.13.2-hamcrest-core-1.3
      - name: Pre-fetch JUnit 4.13.2 + hamcrest-core 1.3 into gradle cache (pinned sha256)
        run: |
          # Pinned sha256 from design §D4 — mismatch is a hard stop, never a silent re-pin.
          JU_SHA256=8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3
          HC_SHA256=66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9

          # Gradle cache layout: ~/.gradle/caches/modules-2/files-2.1/<group>/<artifact>/<version>/<sha1>/
          JU_DIR="$HOME/.gradle/caches/modules-2/files-2.1/junit/junit/4.13.2/8ac9e16d933b6fb43bc7f576336b8f4d7eb5ba12"
          HC_DIR="$HOME/.gradle/caches/modules-2/files-2.1/org.hamcrest/hamcrest-core/1.3/42a25dc3219429f0e5d060061f71acb49bf010a0"

          mkdir -p "$JU_DIR" "$HC_DIR"

          # A cache hit that still matches its sha256 is used as is; anything else is downloaded again.
          echo "${JU_SHA256}  ${JU_DIR}/junit-4.13.2.jar" | sha256sum -c - >/dev/null 2>&1 \
            || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$JU_DIR/junit-4.13.2.jar" \
            "https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar"
          echo "${JU_SHA256}  ${JU_DIR}/junit-4.13.2.jar" | sha256sum -c - \
            || { printf 'sha256 mismatch: junit-4.13.2.jar\n' >&2; exit 1; }

          echo "${HC_SHA256}  ${HC_DIR}/hamcrest-core-1.3.jar" | sha256sum -c - >/dev/null 2>&1 \
            || curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$HC_DIR/hamcrest-core-1.3.jar" \
            "https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          echo "${HC_SHA256}  ${HC_DIR}/hamcrest-core-1.3.jar" | sha256sum -c - \
            || { printf 'sha256 mismatch: hamcrest-core-1.3.jar\n' >&2; exit 1; }

      # Pinned like shellcheck, no apt-get update: bats-core 1.10.0 (the version the ubuntu-latest apt package
      # gave) and GNU parallel, which `bats -j` needs (without it bats runs no test; the bats step counts them).
      # A sha256 mismatch is a hard stop, never a silent re-pin.
      - name: Install bats-core 1.10.0 + GNU parallel 20240222 (pinned sha256)
        run: |
          BATS_VER=1.10.0
          BATS_SHA256=a1a9f7875aa4b6a9480ca384d5865f1ccf1b0b1faead6b47aa47d79709a5c5fd
          PAR_VER=20240222
          PAR_SHA256=eba09b6a7e238f622293f7d461597f35075cb56f170d0a73148f53d259ec8556
          T="$(mktemp -d "${RUNNER_TEMP:-/tmp}/bats-install.XXXXXX")"

          curl -fsSL --retry 3 -o "$T/bats.tar.gz" \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VER}.tar.gz"
          echo "${BATS_SHA256}  $T/bats.tar.gz" | sha256sum -c - \
            || { printf 'sha256 mismatch: bats-core v%s\n' "$BATS_VER" >&2; exit 1; }
          tar -xzf "$T/bats.tar.gz" -C "$T"
          sudo "$T/bats-core-${BATS_VER}/install.sh" /usr/local

          # ftpmirror.gnu.org redirects to a nearby mirror; ftp.gnu.org is the fallback. The sha256 pins the bytes.
          curl -fsSL --retry 3 -o "$T/parallel.tar.bz2" "https://ftpmirror.gnu.org/parallel/parallel-${PAR_VER}.tar.bz2" \
            || curl -fsSL --retry 3 -o "$T/parallel.tar.bz2" "https://ftp.gnu.org/gnu/parallel/parallel-${PAR_VER}.tar.bz2"
          echo "${PAR_SHA256}  $T/parallel.tar.bz2" | sha256sum -c - \
            || { printf 'sha256 mismatch: parallel-%s\n' "$PAR_VER" >&2; exit 1; }
          tar -xjf "$T/parallel.tar.bz2" -C "$T" "parallel-${PAR_VER}/src/parallel"
          sudo install "$T/parallel-${PAR_VER}/src/parallel" /usr/local/bin/parallel
          mkdir -p "$HOME/.parallel" && touch "$HOME/.parallel/will-cite"

          bats --version
          parallel --version | head -n 1

      - name: Set up Go (version from go/go.mod — the niagara-tools Go module)
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          # No go.sum (the module has no dependencies): key the build cache on go.mod instead.
          cache: true
          cache-dependency-path: go/go.mod

      # The python3 the bats suites have always run on: keep the same interpreter on PATH here.
      - name: Set up CPython 3.15 (the python3 the bats suites run)
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      # The pinned npm tools of the kit's JS lints (audit A6): toolbelt/eslint/package.json pins eslint and acorn to
      # exact versions; with them installed the report-module ESLint rows and the lint-vendor-floor acorn tests run
      # instead of skipping. The committed package-lock.json pins the whole tree; `npm ci` installs exactly it (and
      # fails when it disagrees with package.json); npm's download cache is keyed on that lockfile.
      - name: Set up Node.js 24.19.0 (npm cache keyed on toolbelt/eslint/package-lock.json)
        uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: build-n4-module-kit/toolbelt/eslint/package-lock.json

      - name: Install the pinned npm tools (npm ci from toolbelt/eslint/package-lock.json; installed versions asserted)
        run: |
          npm ci --prefix build-n4-module-kit/toolbelt/eslint --ignore-scripts --no-audit --no-fund
          # Every direct devDependency must resolve to exactly its pinned version.
          node -e '
            const dir = "build-n4-module-kit/toolbelt/eslint";
            const pins = require("./" + dir + "/package.json").devDependencies;
            let bad = 0;
            for (const [name, want] of Object.entries(pins)) {
              const got = require("./" + dir + "/node_modules/" + name + "/package.json").version;
              console.log(name + " " + got + (got === want ? "" : " (pinned " + want + ")"));
              if (got !== want) bad = 1;
            }
            process.exit(bad);'

      # The toolbelt wrappers build go/bin on demand; build it once so the parallel suites do not race to.
      - name: Pre-build go/bin (the binaries the bats suites exec through the toolbelt wrappers)
        run: cd go && go build -o bin/ ./cmd/...

      - name: bats (all unit tests) — this job's shard of tests/*.bats
        run: |
          # -j 4: four test files at a time, one per ubuntu-latest vCPU. --no-parallelize-within-files: bats'
          # in-file parallelism waits for a free slot by polling with `sleep 1`, which made -j slower than a
          # serial run; GNU parallel schedules whole files without it. Fail closed: the run must report one
          # result per test in its TAP plan (bats counts the suite up front), so a silent zero or partial
          # parallel run cannot pass. The shard list puts its heaviest files first, so they start at once.
          set -o pipefail
          if [ -n "${SHARD:-}" ]; then mapfile -t files < <(scripts/bats-shard.sh "$SHARD" "$SHARDS"); else files=(tests/*.bats); fi
          [ "${#files[@]}" -gt 0 ] || { printf 'ERROR: no bats files to run\n' >&2; exit 1; }
          printf 'bats: shard %s/%s runs %d files\n' "${SHARD:-all}" "${SHARDS:-all}" "${#files[@]}"
          TAP="$RUNNER_TEMP/bats.tap"
          bats -j 4 --no-parallelize-within-files --formatter tap "${files[@]}" | tee "$TAP"
          plan="$(grep -m 1 -E '^1\.\.[0-9]+$' "$TAP" || true)"; plan="${plan#1..}"
          got="$(grep -cE '^(not )?ok ' "$TAP" || true)"
          printf 'bats: TAP plan %s; %s results\n' "${plan:-missing}" "$got"
          if ! { [ "$plan" -gt 0 ] && [ "$got" -eq "$plan" ]; }; then
            printf 'ERROR: bats reported %s results for a TAP plan of %s tests\n' "$got" "${plan:-missing}" >&2
            exit 1
          fi
          # Global SKIP allowlist (audit A6): every `# skip <reason>` must match a line of tests/bats-skip-allowlist.txt,
          # so no suite can start skipping for a new, unreviewed reason and still read green.
          bash scripts/check-bats-skips.sh "$TAP" tests/bats-skip-allowlist.txt

      - name: run-pure-test.bats — confirm P1-P6 executed with zero SKIPs in CI
        run: |
          bats --formatter tap tests/run-pure-test.bats | tee /tmp/run-pure-test.tap
          if grep -q '# skip' /tmp/run-pure-test.tap; then
            printf 'ERROR: run-pure-test.bats produced SKIP lines — junit pre-fetch may have failed\n' >&2
            exit 1
          fi

  lint-sweeps:
    name: shellcheck + ledger sweeps + kit lints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck (pinned — reproducible, no version drift)
        run: |
          SC=v0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC}/shellcheck-${SC}.linux.x86_64.tar.xz" | tar -xJf -
          sudo install "shellcheck-${SC}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Set up Go (version from go/go.mod — the niagara-tools Go module)
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          # No go.sum (the module has no dependencies): key the build cache on go.mod instead.
          cache: true
          cache-dependency-path: go/go.mod

      - name: shellcheck (scripts, toolbelt, tests) — CONTRIBUTING.md §6
        run: shellcheck scripts/*.sh scripts/lib/*.sh go/*.sh build-n4-module-kit/toolbelt/*.sh build-n4-module-kit/templates/client-pre-push .githooks/* tests/*.bats tests/helpers/*.bash

      - name: sweep-build-state + sweep-fold-audit over fresh kit-state output (BUILD-STATE ↔ retros/INDEX coherence; folded retros cited)
        run: |
          K=build-n4-module-kit
          # BUILD-STATE.md and retros/INDEX.md are generated, not committed: sweep the kit-state output.
          T="$(mktemp -d "${RUNNER_TEMP:-/tmp}/kit-state.XXXXXX")"
          bash "$K/toolbelt/kit-state.sh" build-state > "$T/BUILD-STATE.md"
          bash "$K/toolbelt/kit-state.sh" retro-index > "$T/INDEX.md"
          bash "$K/toolbelt/sweep-build-state.sh" "$T/BUILD-STATE.md" "$K/retros" "$T/INDEX.md"
          # --deltas-since: rows from the 2026-09-24 Δ-citation convention on must cite (or defer)
          # every Δ1..Δn, not just their stem. --exact-stems: a citation credits a fold only by the
          # retro's exact stem, and a short alias token fails (kit #419). --no-research-probe: CI has no
          # niagara-research checkout, so its local twin must not fail on the operator's (DEGRADED is for manual runs).
          bash "$K/toolbelt/sweep-fold-audit.sh" --strict --exact-stems --no-research-probe --deltas-since 2026-09-24 "$T/INDEX.md" "$K"

      - name: lint-bats-heredoc (no here-document line in tests/ starts with the test keyword; bats 1.10 reads it as a case)
        run: |
          . go/go-tool.sh
          "$(go_tool_bin "$PWD/go" ci-steps)" lint-bats-heredoc tests

      - name: lint-guard-pins (every kit lint carries a resolvable "# Mutation:" guard-pin — strict)
        run: bash build-n4-module-kit/toolbelt/lint-guard-pins.sh --strict .

      - name: gen-lint-index --check + --check-guides (every lint header generates its INDEX row, and a types/*.md guide names every lint unless it declares Scope: kit — fails closed)
        run: |
          bash build-n4-module-kit/toolbelt/gen-lint-index.sh --check
          bash build-n4-module-kit/toolbelt/gen-lint-index.sh --check-guides

      - name: gen-retro-index --check (every retro header generates its INDEX row — fails closed)
        run: bash build-n4-module-kit/toolbelt/gen-retro-index.sh --check

      - name: gen-build-state --check (every ledger.d/ fragment + BUILD-STATE.src.md generates BUILD-STATE.md — fails closed)
        run: bash build-n4-module-kit/toolbelt/gen-build-state.sh --check

      - name: gen-changelog --check (every changelog.d/ fragment is one the release fold accepts — fails closed)
        run: bash scripts/gen-changelog.sh --check

      - name: lint-timers (timer-ticket conformance over committed fixtures — Campaign 6 PR8)
        run: |
          bash build-n4-module-kit/toolbelt/lint-timers.sh tests/fixtures/lint-timers

      - name: sweep-retro-debt (aging report — non-strict, Campaign 6 PR8)
        run: |
          K=build-n4-module-kit
          T="$(mktemp -d "${RUNNER_TEMP:-/tmp}/kit-state.XXXXXX")"
          bash "$K/toolbelt/kit-state.sh" retro-index > "$T/INDEX.md"
          bash "$K/toolbelt/sweep-build-state.sh" --age --today "$(date -u +%F)" "$K/retros" "$T/INDEX.md"

      - name: scaffold-diff (scaffold MinimalPan → diff -r vs fixture — Campaign 7 PR4)
        run: |
          # TC4 round-trip (preflight+build+verify) requires JDK 8 + niagara_home and is local-only (SKIP in CI, D9).
          # This step verifies only the scaffold emission itself: scaffold MinimalPan into RUNNER_TEMP,
          # then diff -r the output against the bundled fixture (excluding build/ and .gradle/).
          # The logic fixture carries the opt-in async-offload component, so the round trip runs with --with-offload
          # (every fixture file is emitted) and compares against a copy of the fixture whose offload marker lines are
          # removed by the scaffold's own internal mode (--strip-offload-markers: the one definition of a marker, in
          # go/internal/scaffoldmodule). The markers exist only in the fixture, the scaffold never emits them. A run
          # without the flag is pinned by tests/scaffold-module-offload.bats (OFF1).
          OUT="$RUNNER_TEMP/scaffold-ci"
          FX="$RUNNER_TEMP/scaffold-ci-fixture"
          mkdir -p "$OUT" "$FX"
          cp -r build-n4-module-kit/fixtures/MinimalPan "$FX/"
          bash build-n4-module-kit/toolbelt/scaffold-module.sh --strip-offload-markers "$FX/MinimalPan"
          bash build-n4-module-kit/toolbelt/scaffold-module.sh MinimalPan "$OUT" --vendor Angeles --with-offload
          diff -r --exclude=build --exclude=.gradle "$OUT/MinimalPan" "$FX/MinimalPan"

      - name: scaffold-diff (dashboard — scaffold MinimalDash → diff -r vs fixture — issue #115)
        run: |
          # TC-DASH1 round-trip: scaffold MinimalDash with --type dashboard into RUNNER_TEMP, then diff -r the output
          # against the bundled MinimalDash fixture (excluding build/ and .gradle/). The login overlay
          # (templates/dashboard-login, #847) adds -rt files and inserts lines into five plumbing files: those are
          # left out here and checked by tests/scaffold-module.bats TC-DASH1 and tests/scaffold-module-login.bats.
          OUT="$RUNNER_TEMP/scaffold-ci-dash"
          F=build-n4-module-kit/fixtures/MinimalDash
          R=MinimalDash-rt
          mkdir -p "$OUT"
          bash build-n4-module-kit/toolbelt/scaffold-module.sh MinimalDash "$OUT" --type dashboard --vendor Angeles
          diff -r --exclude=build --exclude=.gradle --exclude=$R --exclude=MODULE-MAP.md "$OUT/MinimalDash" "$F"
          diff -r --exclude=build --exclude=.gradle --exclude=login --exclude=rc --exclude=BMinimalDashService.java \
            --exclude=module-include.xml --exclude=module.palette --exclude=module.lexicon --exclude=$R.gradle.kts \
            "$OUT/MinimalDash/MinimalDash/$R" "$F/MinimalDash/$R"

      - name: schema-risk fixtures (B799 pairs — non-strict, asserts mapped exit + verdict token — Campaign 7 PR5)
        run: |
          # Non-strict run: OUTAGE fixtures EXIT 2 but we assert the EXPECTED exit, not fail CI on it.
          # The mixed pair (OUTAGE) is the key worst-cell proof; add_slot and reorder (SAFE) prove exit 0.
          SR=build-n4-module-kit/toolbelt/schema-risk.sh
          FX=tests/fixtures/schema-risk
          fail=0
          for pair in add_slot:0:SAFE remove_slot:1:LOSSY retype_simple:2:OUTAGE \
                      reorder:0:SAFE rename_slot:1:LOSSY unknown_kind:2:OUTAGE mixed:2:OUTAGE; do
            name="${pair%%:*}"; rest="${pair#*:}"; want_exit="${rest%%:*}"; want_v="${rest##*:}"
            got_exit=0
            out=$(bash "$SR" "$FX/$name/before" "$FX/$name/after" 2>&1) || got_exit=$?
            if [ "$got_exit" -ne "$want_exit" ]; then
              printf 'FAIL %s: exit %d != expected %d\n' "$name" "$got_exit" "$want_exit"
              fail=1
            fi
            if ! echo "$out" | grep -q "verdict=$want_v"; then
              printf 'FAIL %s: verdict token not found (expected verdict=%s)\n' "$name" "$want_v"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: plano-ok fixture (verify-module.sh --plano ok/index.html -> exit 0 — Campaign 7 PR6)
        run: |
          # PL1 fixture: Rc=Ri=Rv=2/3, one agreeing numeric aspect-ratio -> PASS (exit 0).
          bash build-n4-module-kit/toolbelt/verify-module.sh --plano tests/fixtures/plano/ok/index.html

      - name: triage-console basic smoke (Campaign 8 PR2)
        run: |
          bash build-n4-module-kit/toolbelt/triage-console.sh --package com.angeles \
            tests/fixtures/triage-console/console.txt | grep -q 'IllegalArgumentException'


  # The changelog gate of .githooks/pre-push, server side: a clone without the hook still cannot merge a kit
  # behaviour change (go/, build-n4-module-kit/, tools/) with no CHANGELOG entry (CONTRIBUTING.md § 6.2). It needs
  # the history, so its own job checks out with fetch-depth 0. On a pull_request HEAD is the merge commit and
  # origin/main..HEAD is exactly the PR's change; on a push to main the range is empty and the gate is not
  # applicable. The retro half of the hook stays local-only.
  changelog:
    name: changelog gate (kit behaviour changes carry a CHANGELOG entry)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go (version from go/go.mod — the niagara-tools Go module)
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          # No go.sum (the module has no dependencies): key the build cache on go.mod instead.
          cache: true
          cache-dependency-path: go/go.mod

      - name: changelog-gate over origin/main..HEAD (a fragment or a no-entry trailer; [Unreleased] lines only in a release)
        run: bash scripts/changelog-gate.sh --range "$(git merge-base origin/main HEAD)..HEAD"
