name: CI

# Server-side enforcement of the same checks the pre-commit checklist (CONTRIBUTING.md §6)
# and the pre-push gate cover — runs on GitHub for every push/PR, so it cannot be bypassed
# by a clone that did not opt into the client-side hook (scripts/install-hooks.sh).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: shellcheck + bats + ledger sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 8 (Temurin) — required by run-pure-test.sh javac -source 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Pre-fetch JUnit 4.13.2 + hamcrest-core 1.3 into gradle cache (pinned sha256)
        run: |
          # Pinned sha256 from design §D4 — mismatch is a hard stop, never a silent re-pin.
          JU_SHA256=8e495b634469d64fb8acfa3495a065cbacc8a0fff55ce1e31007be4c16dc57d3
          HC_SHA256=66fdef91e9739348df7a096aa384a5685f4e875584cce89386a7a47251c4d8e9

          # Gradle cache layout: ~/.gradle/caches/modules-2/files-2.1/<group>/<artifact>/<version>/<sha1>/
          JU_DIR="$HOME/.gradle/caches/modules-2/files-2.1/junit/junit/4.13.2/8ac9e16d933b6fb43bc7f576336b8f4d7eb5ba12"
          HC_DIR="$HOME/.gradle/caches/modules-2/files-2.1/org.hamcrest/hamcrest-core/1.3/42a25dc3219429f0e5d060061f71acb49bf010a0"

          mkdir -p "$JU_DIR" "$HC_DIR"

          curl -fsSL -o "$JU_DIR/junit-4.13.2.jar" \
            "https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar"
          echo "${JU_SHA256}  ${JU_DIR}/junit-4.13.2.jar" | sha256sum -c - \
            || { printf 'sha256 mismatch: junit-4.13.2.jar\n' >&2; exit 1; }

          curl -fsSL -o "$HC_DIR/hamcrest-core-1.3.jar" \
            "https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          echo "${HC_SHA256}  ${HC_DIR}/hamcrest-core-1.3.jar" | sha256sum -c - \
            || { printf 'sha256 mismatch: hamcrest-core-1.3.jar\n' >&2; exit 1; }

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install shellcheck (pinned — reproducible, no version drift)
        run: |
          SC=v0.10.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC}/shellcheck-${SC}.linux.x86_64.tar.xz" | tar -xJf -
          sudo install "shellcheck-${SC}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Set up Go (version from go/go.mod — the niagara-tools Go module)
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache: false

      # The mcp-n4 target (go/internal/mcpn4/pytarget.Minor): the Go differentials compare against
      # it and skip on any other python3, so CI must provide it. Later steps run it too.
      - name: Set up CPython 3.15 (the mcp-n4 target the Go differentials compare against)
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Go gofmt + vet + test (go/)
        run: |
          cd go
          # The assignment fails the step when gofmt itself fails; a non-empty list fails it too.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then printf 'gofmt -l lists unformatted files:\n%s\n' "$unformatted" >&2; exit 1; fi
          go vet ./...
          # A differential against another python3 would skip, not pass: refuse that in CI.
          MCP_N4_PYTHON="$(command -v python3)" go test ./...

      - name: Go build (go/bin — the binaries the toolbelt wrappers exec)
        run: cd go && go build -o bin/ ./cmd/...

      - name: shellcheck (scripts, toolbelt, tests) — CONTRIBUTING.md §6
        run: shellcheck scripts/*.sh scripts/lib/*.sh go/*.sh build-n4-module-kit/toolbelt/*.sh build-n4-module-kit/toolbelt/lib/*.sh build-n4-module-kit/templates/client-pre-push tests/*.bats tests/helpers/*.bash

      - name: kit-state --write (materialize the generated BUILD-STATE.md + retros/INDEX.md, as install-skill.sh and the .githooks do)
        run: bash build-n4-module-kit/toolbelt/kit-state.sh --write

      - name: bats (all unit tests)
        run: bats tests/*.bats

      - name: mcp-n4-kit unittest
        run: python3 -m unittest discover -s mcp-n4-kit/tests -v

      - name: run-pure-test.bats — confirm P1-P6 executed with zero SKIPs in CI
        run: |
          bats --formatter tap tests/run-pure-test.bats | tee /tmp/run-pure-test.tap
          if grep -q '# skip' /tmp/run-pure-test.tap; then
            printf 'ERROR: run-pure-test.bats produced SKIP lines — junit pre-fetch may have failed\n' >&2
            exit 1
          fi

      - name: sweep-build-state + sweep-fold-audit over fresh kit-state output (BUILD-STATE ↔ retros/INDEX coherence; folded retros cited)
        run: |
          K=build-n4-module-kit
          # BUILD-STATE.md and retros/INDEX.md are generated, not committed: sweep the kit-state output.
          T="$(mktemp -d "${RUNNER_TEMP:-/tmp}/kit-state.XXXXXX")"
          bash "$K/toolbelt/kit-state.sh" build-state > "$T/BUILD-STATE.md"
          bash "$K/toolbelt/kit-state.sh" retro-index > "$T/INDEX.md"
          bash "$K/toolbelt/sweep-build-state.sh" "$T/BUILD-STATE.md" "$K/retros" "$T/INDEX.md"
          # --deltas-since: rows from the 2026-09-24 Δ-citation convention on must cite (or defer)
          # every Δ1..Δn, not just their stem.
          bash "$K/toolbelt/sweep-fold-audit.sh" --strict --deltas-since 2026-09-24 "$T/INDEX.md" "$K"

      - name: lint-guard-pins (every kit lint carries a resolvable "# Mutation:" guard-pin — strict)
        run: bash build-n4-module-kit/toolbelt/lint-guard-pins.sh --strict .

      - name: gen-lint-index --check (generated toolbelt/INDEX.md is fresh vs the lint headers)
        run: bash build-n4-module-kit/toolbelt/gen-lint-index.sh --check

      - name: gen-retro-index --check (every retro header generates its INDEX row — fails closed)
        run: bash build-n4-module-kit/toolbelt/gen-retro-index.sh --check

      - name: gen-build-state --check (every ledger.d/ fragment + BUILD-STATE.src.md generates BUILD-STATE.md — fails closed)
        run: bash build-n4-module-kit/toolbelt/gen-build-state.sh --check

      - name: lint-timers (timer-ticket conformance over committed fixtures — Campaign 6 PR8)
        run: |
          bash build-n4-module-kit/toolbelt/lint-timers.sh tests/fixtures/lint-timers

      - name: sweep-retro-debt (aging report — non-strict, Campaign 6 PR8)
        run: |
          K=build-n4-module-kit
          T="$(mktemp -d "${RUNNER_TEMP:-/tmp}/kit-state.XXXXXX")"
          bash "$K/toolbelt/kit-state.sh" retro-index > "$T/INDEX.md"
          bash "$K/toolbelt/sweep-build-state.sh" --age --today "$(date -u +%F)" "$K/retros" "$T/INDEX.md"

      - name: scaffold-diff (scaffold MinimalPan → diff -r vs fixture — Campaign 7 PR4)
        run: |
          # TC4 round-trip (preflight+build+verify) requires JDK 8 + niagara_home and is local-only (SKIP in CI, D9).
          # This step verifies only the scaffold emission itself: scaffold MinimalPan into RUNNER_TEMP,
          # then diff -r the output against the bundled fixture (excluding build/ and .gradle/).
          OUT="$RUNNER_TEMP/scaffold-ci"
          mkdir -p "$OUT"
          bash build-n4-module-kit/toolbelt/scaffold-module.sh MinimalPan "$OUT"
          diff -r --exclude=build --exclude=.gradle "$OUT/MinimalPan" build-n4-module-kit/fixtures/MinimalPan

      - name: scaffold-diff (dashboard — scaffold MinimalDash → diff -r vs fixture — issue #115)
        run: |
          # TC-DASH1 round-trip: scaffold MinimalDash with --type dashboard into RUNNER_TEMP,
          # then diff -r the output against the bundled MinimalDash fixture (excluding build/ and .gradle/).
          OUT="$RUNNER_TEMP/scaffold-ci-dash"
          mkdir -p "$OUT"
          bash build-n4-module-kit/toolbelt/scaffold-module.sh MinimalDash "$OUT" --type dashboard
          diff -r --exclude=build --exclude=.gradle "$OUT/MinimalDash" build-n4-module-kit/fixtures/MinimalDash

      - name: schema-risk fixtures (B799 pairs — non-strict, asserts mapped exit + verdict token — Campaign 7 PR5)
        run: |
          # Non-strict run: OUTAGE fixtures EXIT 2 but we assert the EXPECTED exit, not fail CI on it.
          # The mixed pair (OUTAGE) is the key worst-cell proof; add_slot and reorder (SAFE) prove exit 0.
          SR=build-n4-module-kit/toolbelt/schema-risk.sh
          FX=tests/fixtures/schema-risk
          fail=0
          for pair in add_slot:0:SAFE remove_slot:1:LOSSY retype_simple:2:OUTAGE \
                      reorder:0:SAFE rename_slot:1:LOSSY unknown_kind:2:OUTAGE mixed:2:OUTAGE; do
            name="${pair%%:*}"; rest="${pair#*:}"; want_exit="${rest%%:*}"; want_v="${rest##*:}"
            got_exit=0
            out=$(bash "$SR" "$FX/$name/before" "$FX/$name/after" 2>&1) || got_exit=$?
            if [ "$got_exit" -ne "$want_exit" ]; then
              printf 'FAIL %s: exit %d != expected %d\n' "$name" "$got_exit" "$want_exit"
              fail=1
            fi
            if ! echo "$out" | grep -q "verdict=$want_v"; then
              printf 'FAIL %s: verdict token not found (expected verdict=%s)\n' "$name" "$want_v"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: plano-ok fixture (verify-module.sh --plano ok/index.html -> exit 0 — Campaign 7 PR6)
        run: |
          # PL1 fixture: Rc=Ri=Rv=2/3, one agreeing numeric aspect-ratio -> PASS (exit 0).
          bash build-n4-module-kit/toolbelt/verify-module.sh --plano tests/fixtures/plano/ok/index.html

      - name: triage-console basic smoke (Campaign 8 PR2)
        run: |
          bash build-n4-module-kit/toolbelt/triage-console.sh --package com.angeles \
            tests/fixtures/triage-console/console.txt | grep -q 'IllegalArgumentException'
